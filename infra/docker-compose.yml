services:
  postgres:
    image: postgres:17
    container_name: school_erp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: school_erp_redis
    restart: unless-stopped
    ports:
      - '6379:6379'

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: school_erp_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../backend:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: school_management
      DB_USERNAME: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    expose:
      - '8000'

  nginx:
    image: nginx:1.27
    container_name: school_erp_nginx
    restart: unless-stopped
    ports:
      - '8080:80'
    volumes:
      - ../backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
